name: Generate verb audio

on:
  workflow_dispatch:
    inputs:
      start_rank:
        description: "First verb rank to generate"
        required: true
        default: "1"
      end_rank:
        description: "Last verb rank to generate"
        required: true
        default: "350"
      limit:
        description: "Optional selected-row limit before skipping existing files; 0 means no selection limit"
        required: true
        default: "0"
      max_successes:
        description: "Max newly generated WAV files per run; 8 is safe for free-tier daily quota, 0 means no cap"
        required: true
        default: "8"
      force:
        description: "Regenerate existing WAV files"
        required: true
        type: boolean
        default: false
      voice:
        description: "Gemini prebuilt voice name"
        required: true
        default: "Aoede"
      model:
        description: "Gemini TTS model"
        required: true
        default: "gemini-3.1-flash-tts-preview"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/generate-verb-audio.yml"
      - ".github/audio-generation-trigger.txt"
      - "scripts/generate_gemini_aoede_audio_from_table.py"

permissions:
  contents: write

env:
  GOOGLE_AI_API_KEY: ${{ secrets.GOOGLE_AI_API_KEY }}
  START_RANK: ${{ inputs.start_rank || '1' }}
  END_RANK: ${{ inputs.end_rank || '350' }}
  LIMIT: ${{ inputs.limit || '0' }}
  MAX_SUCCESSES: ${{ inputs.max_successes || '8' }}
  FORCE_AUDIO: ${{ inputs.force || 'false' }}
  AOEDE_VOICE: ${{ inputs.voice || 'Aoede' }}
  GEMINI_TTS_MODEL: ${{ inputs.model || 'gemini-3.1-flash-tts-preview' }}

jobs:
  generate-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show checked-out commit
        run: git log -1 --format=%H

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate secret
        run: |
          if [ -z "$GOOGLE_AI_API_KEY" ]; then
            echo "GOOGLE_AI_API_KEY secret is missing. Add it in Settings -> Secrets and variables -> Actions."
            exit 2
          fi

      - name: Generate Gemini Aoede verb audio
        run: |
          FORCE_FLAG=""
          if [ "$FORCE_AUDIO" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/generate_gemini_aoede_audio_from_table.py \
            --repo-root . \
            --out-dir public/audio/verbs \
            --model "$GEMINI_TTS_MODEL" \
            --voice "$AOEDE_VOICE" \
            --start-rank "$START_RANK" \
            --end-rank "$END_RANK" \
            --limit "$LIMIT" \
            --max-successes "$MAX_SUCCESSES" \
            $FORCE_FLAG

      - name: Upload generated audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: hebrewme-verb-audio
          path: |
            public/audio/verbs/*.wav
            public/audio/verbs-manifest.csv
            public/audio/verbs-manifest.json
            public/audio/verbs-generation-status.csv

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/verbs public/audio/verbs-manifest.csv public/audio/verbs-manifest.json public/audio/verbs-generation-status.csv
          if git diff --cached --quiet; then
            echo "No generated audio changes to commit."
            exit 0
          fi
          git commit -m "Generate Gemini Aoede verb audio"
          git push
