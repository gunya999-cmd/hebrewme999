name: UX release checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/ux-2026-10-18, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npm run build
      - run: npm test -- --run
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.ux.config.ts
