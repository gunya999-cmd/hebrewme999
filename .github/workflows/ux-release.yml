name: UX release checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/browser/ux-redesign.spec.ts'
      - 'playwright.ux.config.ts'
      - '.github/workflows/ux-release.yml'
  push:
    branches: [release/ux-2026-10-18, main]
    paths:
      - 'src/**'
      - 'tests/browser/ux-redesign.spec.ts'
      - 'playwright.ux.config.ts'
      - '.github/workflows/ux-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm test -- --run
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test --config=playwright.ux.config.ts
