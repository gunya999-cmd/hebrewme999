name: Generate Edge verb audio

on:
  workflow_dispatch:
    inputs:
      start_rank:
        description: "First verb rank to generate"
        required: true
        default: "1"
      end_rank:
        description: "Last verb rank to generate"
        required: true
        default: "350"
      limit:
        description: "Optional selected-row limit before skipping existing files; 0 means no selection limit"
        required: true
        default: "0"
      max_successes:
        description: "Max newly generated MP3 files per run; 0 means no cap"
        required: true
        default: "0"
      force:
        description: "Regenerate existing MP3 files"
        required: true
        type: boolean
        default: false
      voice:
        description: "Microsoft Edge TTS voice"
        required: true
        default: "he-IL-HilaNeural"
      rate:
        description: "Speech rate"
        required: true
        default: "-10%"
      volume:
        description: "Speech volume"
        required: true
        default: "+0%"

permissions:
  contents: write

jobs:
  generate-edge-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Show checked-out commit
        run: git log -1 --format=%H

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Edge TTS
        run: python -m pip install --upgrade edge-tts

      - name: Generate Edge Hebrew verb audio
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/generate_edge_hebrew_audio_from_table.py \
            --repo-root . \
            --out-dir public/audio/verbs \
            --voice="${{ inputs.voice }}" \
            --rate="${{ inputs.rate }}" \
            --volume="${{ inputs.volume }}" \
            --start-rank="${{ inputs.start_rank }}" \
            --end-rank="${{ inputs.end_rank }}" \
            --limit="${{ inputs.limit }}" \
            --max-successes="${{ inputs.max_successes }}" \
            $FORCE_FLAG

      - name: Upload generated Edge audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: hebrewme-edge-verb-audio
          path: |
            public/audio/verbs/*.mp3
            public/audio/verbs-edge-manifest.csv
            public/audio/verbs-edge-manifest.json
            public/audio/verbs-edge-generation-status.csv

      - name: Commit generated Edge audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/verbs/*.mp3 public/audio/verbs-edge-manifest.csv public/audio/verbs-edge-manifest.json public/audio/verbs-edge-generation-status.csv
          if git diff --cached --quiet; then
            echo "No generated Edge audio changes to commit."
            exit 0
          fi
          git commit -m "Generate Edge Hebrew verb audio"
          git push
