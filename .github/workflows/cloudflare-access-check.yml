name: HebrewMe Cloudflare access check

on:
  workflow_dispatch:
  push:
    branches:
      - feature/miriam-v2
    paths:
      - '.github/workflows/cloudflare-access-check.yml'

permissions:
  contents: read

jobs:
  verify-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify scoped Cloudflare credentials and Pages project
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CF_TOKEN" || -z "$CF_ACCOUNT_ID" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          fi
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          token_response=$(mktemp)
          token_status=$(curl --silent --show-error --max-time 20 \
            --output "$token_response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CF_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          if [[ "$token_status" != "200" ]]; then
            echo "::error::Token verification failed (HTTP $token_status)."
            exit 1
          fi
          node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if (!d.success || d.result?.status !== "active") process.exit(1); console.log("Cloudflare API token is active.")' "$token_response"
          if [[ ! "$CF_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Account ID must contain exactly 32 hexadecimal characters."
            exit 1
          fi
          response=$(mktemp)
          status=$(curl --silent --show-error --max-time 20 \
            --output "$response" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CF_TOKEN" \
            --header "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects")
          if [[ "$status" != "200" ]]; then
            echo "::error::Cloudflare Pages projects list failed (HTTP $status). Verify token permissions and account."
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!data.success || !Array.isArray(data.result)) {
              console.error("Cloudflare did not return a valid Pages project list.");
              process.exit(1);
            }
            const names = data.result.map(project => project.name);
            if (!names.includes("hebrewme999")) {
              console.error("Expected Pages project hebrewme999 was not found in the selected account.");
              console.log("Pages projects visible to this token: " + (names.join(", ") || "(none)"));
              process.exit(1);
            }
            console.log("Cloudflare credentials validated for Pages project hebrewme999.");
          ' "$response"
          echo "No deployment, settings, secrets or Access policies were modified."
