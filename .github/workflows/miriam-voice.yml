name: Miriam voice checks

on:
  pull_request:
    paths:
      - 'src/pages/VoiceDialogue.tsx'
      - 'src/components/MiriamAvatar3D.tsx'
      - 'src/pages/AITutor.tsx'
      - 'src/lib/miriam*.ts'
      - 'supabase/migrations/*miriam*'
      - '.github/workflows/miriam-voice.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run
